<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <style>
      .name { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; animation: fade 1.2s ease-out both; }
      .sub  { font: 500 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #DDD6FE; animation: fade 1.2s ease-out 0.5s both; }
      .wave { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>
  <rect width="1200" height="260" fill="url(#g)"/>
  <circle cx="110" cy="60" r="90" fill="#7C3AED" opacity="0.18"/>
  <circle cx="1100" cy="40" r="120" fill="#A78BFA" opacity="0.12"/>
  <g class="wave">
    <path d="M0 210 C 200 170, 400 250, 600 210 S 1000 170, 1260 210 L 1260 260 L 0 260 Z" fill="#A78BFA" opacity="0.25"/>
    <path d="M0 230 C 250 200, 450 270, 700 230 S 1050 200, 1260 230 L 1260 260 L 0 260 Z" fill="#7C3AED" opacity="0.35"/>
  </g>
  <text x="600" y="115" text-anchor="middle" class="name" fill="url(#t)">Abdul Samad</text>
  <text x="600" y="160" text-anchor="middle" class="sub">Associate Software Engineer  •  AI/ML &amp; Full-Stack Developer</text>
</svg>
